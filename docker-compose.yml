# docker-compose.yml for the Project Management Platform
#
# Usage:
#   cp .env.example .env       # then edit values
#   docker compose up -d --build
#   open http://localhost:${APP_PORT}
#
# Configurable via .env:
#   APP_PORT         host port mapped to the web server (default 80)
#   DB_NAME          database name created on first run
#   DB_USER          application database user
#   DB_PASSWORD      application database password
#   MYSQL_ROOT_PASSWORD  root password for the MariaDB container

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pmp-php
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_PROTOCOL: ${SMTP_PROTOCOL}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      APP_URL: ${APP_URL}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pmp-net

  web:
    image: nginx:alpine
    container_name: pmp-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - pmp-net

  db:
    image: mariadb:10.11
    container_name: pmp-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - pmp-db-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # NOTE (v1.6.0): the historical `02-subtask.sql` mount was removed.
      # Parent rollups are computed in PHP via calculateTaskCompletionMap();
      # see database/schema.sql header and subtask_functions.sql.disabled.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pmp-net

  # ---- v2.0 design mockup (dev only) ----------------------------------
  # Serves docs/design/2.0/*.html as static files.
  # It is INDEPENDENT of the application stack: no depends_on, no DB,
  # no PHP. It is behind a compose profile so a plain `docker compose up -d`
  # does not start it.
  #
  #   docker compose up -d mockup     # then open http://localhost:8080/
  #   docker compose down mockup      # stop and remove it
  #
  # See docs/issues/issue-036.md
  mockup:
    image: nginx:alpine
    container_name: pmp-mockup
    restart: unless-stopped
    profiles:
      - mockup
    ports:
      - "${MOCKUP_PORT:-8080}:80"
    volumes:
      # The mockup's index.html links to ../../issues/issue-035.md.
      # Mount ONLY that single file: the whole docs/issues/ tree must
      # never be published. The remaining 50 issue documents contain
      # internal defect write-ups, schema notes and SQL migrations
      # (issue-036 constraint: "expose only issue-035.md").
      - ./docs/design/2.0:/usr/share/nginx/html/design/2.0:ro
      - ./docs/issues/issue-035.md:/usr/share/nginx/html/issues/issue-035.md:ro
      - ./docker/mockup-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - pmp-net

volumes:
  pmp-db-data:

networks:
  pmp-net:
    driver: bridge