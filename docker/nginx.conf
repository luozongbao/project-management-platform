server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 32M;

    # Security headers (issue-020). PHP also sends these; nginx
    # covers the static-asset 200/404 responses. CSP and
    # Permissions-Policy are PHP-only because nginx add_header for
    # those would require escaping the semicolons.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block non-public source, dependency, database, deployment, and
    # documentation directories before any PHP or static-file location.
    location ~* ^/(?:includes|database|docs|vendor|docker)(?:/|$) {
        return 404;
    }

    # Block development / diagnostic scripts. These are repo-only tools:
    # _diag.php publishes file MD5 checksums, PHP runtime settings and
    # captured request bodies, and _smtp_test.php can send real email.
    # Neither may be reachable from the public webroot.
    location ~* ^/(?:_diag|_smtp_test)\.php$ {
        return 404;
    }

    # Block configuration, development, and other non-public files. Keep these
    # regex locations before the PHP handler so sensitive PHP files never run.
    location ~* (?:^|/)(?:\.env(?:\.[^/]*)?|\.htaccess|\.htpasswd|config[^/]*|composer\.(?:json|lock)|package\.(?:json|lock)|docker-compose(?:\.[^/]*)?|Dockerfile|README(?:\.[^/]*)?|RELEASE(?:\.[^/]*)?)$ {
        return 404;
    }
    location ~* \.(?:sql|log|ini|conf|ya?ml|md|dist|bak|backup|old|orig|swp|tmp|dump|db|sqlite3?|pem|key|crt|cache|lock)$ {
        return 404;
    }

    # Permit only the client dashboard under /client/. In particular,
    # client/lang.php is an include, not a public endpoint. /client/index.php
    # is a redirect shim (issue-004) that 302s to the new root entry point.
    location ~ ^/client/(?!index\.php$|dashboard\.php$).+\.php$ {
        return 404;
    }

    # Public client portal. The primary entry point is the domain root
    # (/index.php — issue-004), which renders the share-code form and
    # forwards valid codes to /client/dashboard.php. /client/index.php is a
    # redirect shim that preserves the original query string.
    location /client/ {
        try_files $uri $uri/ /client/index.php;
    }
    location ~ ^/client/.+\.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    # Block dotfiles except for the conventional ACME challenge directory.
    location ~* /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # v2.0 legacy .php -> slug 301s (issue-035 Appendix C.2 R11/R12).
    #
    # These files still exist and are still the routing targets for the slug
    # URLs, but their own URLs must 301 to the canonical slug form. Sending
    # them straight to php-fpm would render the page at the old URL and leave
    # it in the address bar, which is exactly what R11 forbids.
    #
    # This block is listed BEFORE the generic \.php$ handler on purpose:
    # nginx evaluates regex locations in file order, so the first match wins
    # and these names reach the front controller instead of the raw script.
    #
    # It does NOT `rewrite ... last`. That would restart location matching
    # with URI /index.php, which then matches the \.php$ handler below and
    # lands on the plain script - the 301 would never run. Handing the request
    # to php-fpm with SCRIPT_FILENAME pinned to the front controller keeps the
    # original URI intact, so REQUEST_URI and the query string still arrive.
    #
    # It is deliberately narrow - it names the legacy entry points explicitly
    # rather than matching \.php$, so no other PHP file's handling changes,
    # and it sits after every deny rule above, so no deny is weakened.
    location ~* ^/(?:dashboard|projects|tasks|contacts|profile|login|register|logout|forgot_password|reset_password|project_detail|project_edit|project_delete|task_detail|task_edit|contact_detail|contact_edit)\.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 300;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    # Static asset caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        # Issue-020: nginx add_header does not inherit from the parent
        # server block into nested location blocks, so the 3 simple
        # security headers must be redeclared here.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}