server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 32M;

    # Block non-public source, dependency, database, deployment, and
    # documentation directories before any PHP or static-file location.
    location ~* ^/(?:includes|database|docs|vendor|docker)(?:/|$) {
        return 404;
    }

    # Block configuration, development, and other non-public files. Keep these
    # regex locations before the PHP handler so sensitive PHP files never run.
    location ~* (?:^|/)(?:\.env(?:\.[^/]*)?|\.htaccess|\.htpasswd|config[^/]*|composer\.(?:json|lock)|package\.(?:json|lock)|docker-compose(?:\.[^/]*)?|Dockerfile|README(?:\.[^/]*)?|RELEASE(?:\.[^/]*)?|_smtp_test\.php)$ {
        return 404;
    }
    location ~* \.(?:sql|log|ini|conf|ya?ml|md|dist|bak|backup|old|orig|swp|tmp|dump|db|sqlite3?|pem|key|crt|cache|lock)$ {
        return 404;
    }

    # Permit only the client-facing portal and dashboard scripts. In
    # particular, client/lang.php is an include, not a public endpoint.
    location ~ ^/client/(?!index\.php$|dashboard\.php$).+\.php$ {
        return 404;
    }

    # Public client portal (added 2026-10-03). Lives in /client/ but the URL
    # is /client/. We serve /client/index.php for /client/, and forward all
    # other /client/*.php requests straight to PHP-FPM with their file path.
    location /client/ {
        try_files $uri $uri/ /client/index.php;
    }
    location ~ ^/client/.+\.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    # Block dotfiles except for the conventional ACME challenge directory.
    location ~* /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    # Static asset caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }
}